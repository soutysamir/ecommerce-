<div class="app">
  <router-outlet></router-outlet>
  <ngx-spinner
    bdColor="rgba(0, 0, 0, .8)"
    template="<img class='w-[150px] animate-bounce' src='/images/blue.png' />"
  >
    <span class="text-[#08C2FF] text-2xl text-center animate-bounce"
      >FreshCart is Loading.......</span
    >
  </ngx-spinner>
  <!-- scroll-to-top.component.html -->
  @if (isVisible===true) {
  <button
    (click)="scrollToTop()"
    class="fixed bottom-6 right-6 bg-[#08C2FF] text-black px-3 py-2 rounded-full shadow-lg hover:bg-[#FFF100] transition-all duration-300 animate-fade-in"
  >
    <i class="fa-solid fa-arrow-up text-xl font-bold"></i></button
  >}
</div>
